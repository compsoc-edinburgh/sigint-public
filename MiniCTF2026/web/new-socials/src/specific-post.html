<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="./style-1.css">
    <title>New Social - Post</title>

    <script>
        async function loadPost() {
            try {
                const urlParams = new URLSearchParams(window.location.search);
                const postId = urlParams.get('id');
                
                if (!postId) {
                    throw new Error('No post ID provided');
                }

                const response = await fetch(`./api/post?id=${postId}`);
                if (!response.ok) {
                    throw new Error('Network response was not ok');
                }
                const post = await response.json();
                if (!post || post.error) {
                    throw new Error(post.error || 'Post not found');
                }
                displayPost(post);
            } catch (error) {
                console.error('Error fetching post:', error);
            }
        }

        function displayPost(post) {
            const postContainer = document.querySelector('.Post');
            postContainer.innerHTML = '<hr>';
            const postElement = document.createElement('div');
                postElement.id = `post-${post.id}`;
                postElement.className = 'Post';
                postElement.innerHTML = `
                    <h2>${post.title}</h2>
                    <p>${post.content}</p>
                    <small>Posted @ ${new Date(post.date).toISOString()}</small>
                    <hr>
                    <button onclick="fetch('./api/report?id=${post.id}'); alert('Post reported!');">Report</button>
                `;
                postContainer.appendChild(postElement);
            document.title = `New Social - Post ${post.id}`;
        }

        loadPost();
    </script>
</head>
<body>
    <header>
        <h1 class="Header-Label">New Social</h1>
        <div class="Header-Buttons">
            <a class="Header-Button" id="home" href="./">Home</a>
            <a class="Header-Button" id="new-post" href="./new-post">New Post</a>
        </div>
    </header>

    <main>
        <div class="Post">
            <p>Loading post...</p>

        </div>
    </main>
</body>
</html>
