<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="./style-1.css">
    <title>New Social - New Post</title>
    <script>
        function createPost() {
            const title = document.getElementById('title').value;
            const content = document.getElementById('content').value;

            fetch('./api/new-post?title=' + encodeURIComponent(title) + '&content=' + encodeURIComponent(content))
            .then(response => {
                if (!response.ok) {
                    throw new Error('Network response was not ok');
                }
                return response.json();
            })
            .then(post => {
                if (post && !post.error) {
                    alert('Post created successfully!');
                    window.location.href = './'; 
                } else {
                    throw new Error(post.error || 'Unknown error occurred');
                }
            })
            .catch(error => {
                console.error('Error creating post:', error);
                alert('Failed to create post.');
            });
        }
    </script>

</head>
<body>
    <header>
        <h1 class="Header-Label">New Social</h1>
        <div class="Header-Buttons">
            <a class="Header-Button" id="home" href="./">Home</a>
            <a class="Header-Button" id="new-post" href="./new-post">New Post</a>
        </div>
    </header>

    <main>
        <form id="new-post-form" onsubmit="event.preventDefault(); createPost();">
            <label for="title">Title:</label>
            <input type="text" id="title" name="title" required>
            <br>
            <label for="content">Content:</label>
            <input id="content" name="content" required></textarea>
            <br>
            <button type="submit">Create Post</button>
    </main>

</body>
</html>
