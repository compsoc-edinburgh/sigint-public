events {}

http {
  server {
    listen       0.0.0.0:80;

    location / {
    	add_header "X-SIGINT-FLAG-CHUNK" "1n_th3_90s}";
        root   /usr/share/nginx/html;
        index  index.html index.htm;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
 }
}

